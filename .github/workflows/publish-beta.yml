name: publish-beta

# 测试版：master/main 有代码变更时自动推送 GitHub Packages 与 NuGet.org。
# 测试版不创建 GitHub Release，正式 Release 由 tag 触发的 publish.yml 负责。

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'NewLife.JT809/**'
      - '.github/workflows/publish-beta.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Restore
      run: dotnet restore XUnitTest/XUnitTest.csproj
    - name: Build
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release --no-restore
    - name: Test
      # 测试版本同样只在全绿时推送
      env:
        XUNIT_MAX_PARALLEL_THREADS: 1
      run: dotnet test XUnitTest/XUnitTest.csproj -c Release --no-build

  build-publish:
    name: build-publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d-beta%H%M')" >> $GITHUB_ENV
    - name: Restore
      run: dotnet restore NewLife.JT809/NewLife.JT809.csproj
    - name: Pack
      run: dotnet pack --no-restore --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.JT809/NewLife.JT809.csproj
    - name: Verify package
      run: |
        set -euo pipefail
        pkg=$(ls out/*.nupkg | head -n 1)
        listing=$(unzip -Z1 "$pkg")
        for tfm in netstandard2.0 net8.0 net10.0; do
          grep -qxF "lib/$tfm/NewLife.JT809.dll" <<< "$listing"
        done
        ls out/*.snupkg > /dev/null
    - name: Publish to GitHub Packages
      run: dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
        dotnet nuget push ./out/*.snupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
