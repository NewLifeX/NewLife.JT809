name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          9.x
          10.x
    - name: Restore
      run: dotnet restore XUnitTest/XUnitTest.csproj
    - name: Build
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release --no-restore
    - name: Test
      run: dotnet test XUnitTest/XUnitTest.csproj -c Release --no-build
