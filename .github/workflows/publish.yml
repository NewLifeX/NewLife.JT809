name: publish

# 正式发版：测试全绿后同时推送 GitHub Packages 与 NuGet.org，并在 tag 推送时创建 GitHub Release。
# 参照 NewLife.Core 的发布流水线，但全程优先使用 Ubuntu 运行器；版本号由 tag 决定，手工触发时按当天日期生成。

on:
  push:
    tags: [ v* ]
  workflow_dispatch:

# 必须同时声明：缺 packages: write 会让 GitHub Packages 推送 403，缺 contents: write 无法创建 Release
permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Restore
      run: dotnet restore XUnitTest/XUnitTest.csproj
    - name: Build
      run: dotnet build XUnitTest/XUnitTest.csproj -c Release --no-restore
    - name: Test
      # 正式包发布前必须全绿，避免把失败版本推到源上
      env:
        XUNIT_MAX_PARALLEL_THREADS: 1
      run: dotnet test XUnitTest/XUnitTest.csproj -c Release --no-build

  build-publish:
    name: build-publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        # SourceLink 需要完整提交历史才能生成源码链接
        fetch-depth: 0
    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          10.x
    - name: Resolve version
      # tag 推送时以 tag 为准（v1.1.2026.1024 → 1.1.2026.1024），手工触发时沿用 csproj 前缀 + 当天日期
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "PACK_ARGS=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
        else
          echo "VERSION=$(date '+%Y.%m%d')" >> "$GITHUB_ENV"
          echo "PACK_ARGS=--version-suffix $(date '+%Y.%m%d')" >> "$GITHUB_ENV"
        fi
    - name: Restore
      run: dotnet restore NewLife.JT809/NewLife.JT809.csproj
    - name: Pack
      run: dotnet pack NewLife.JT809/NewLife.JT809.csproj -c Release --no-restore -o out $PACK_ARGS
    - name: Verify package
      run: |
        set -euo pipefail
        pkg=$(ls out/*.nupkg | head -n 1)
        echo "package: $pkg"
        listing=$(unzip -Z1 "$pkg")
        for tfm in netstandard2.0 net8.0 net10.0; do
          grep -qxF "lib/$tfm/NewLife.JT809.dll" <<< "$listing"
        done
        for entry in README.nuget.md leaf.png; do
          grep -qxF "$entry" <<< "$listing"
        done
        ls out/*.snupkg > /dev/null
        echo "打包布局校验通过：$VERSION"
    - name: Publish to GitHub Packages
      id: ghpackages
      # 备用镜像渠道，失败只告警，不阻断 NuGet.org 正式发布
      continue-on-error: true
      run: dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
    - name: Publish to NuGet.org
      id: nuget
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
        dotnet nuget push ./out/*.snupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
    - name: Create GitHub Release
      id: release
      # 仅 tag 推送时创建；手工触发（无 tag）只发包
      if: startsWith(github.ref, 'refs/tags/')
      # 观察期：失败只告警，不影响已完成的发包；结尾 Publish Summary 会显式标红
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME}"
        repo="${GITHUB_REPOSITORY}"

        # 幂等：同 tag 已有 Release 就直接跳过，失败重跑不会报错
        if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
          echo "Release $tag 已存在，跳过"
          exit 0
        fi

        args=(release create "$tag" --repo "$repo" --title "$tag" --verify-tag)

        # 发布说明优先取 ChangeLog.md 中当前版本段落（标题形如 "## v1.1.2026.1024 (2026-10-24)"）
        version="$VERSION"
        notes=""
        if [[ -f ChangeLog.md ]]; then
          notes=$(awk -v ver="$version" '
            BEGIN { gsub(/\./, "\\.", ver) }
            $0 ~ "^##[[:space:]]+v?" ver "([[:space:]]|\\(|$)" { f = 1; print; next }
            f && /^##[[:space:]]/ { exit }
            f { print }
          ' ChangeLog.md)
        fi

        if [[ -n "$notes" ]]; then
          echo "$notes" > release-notes.md
          args+=(--notes-file release-notes.md)
          echo "发布说明取自 ChangeLog.md 的 $version 段落"
        else
          args+=(--generate-notes)
          echo "ChangeLog.md 未找到 $version 段落，改用自动生成说明"
        fi

        args+=(out/*.nupkg out/*.snupkg)
        gh "${args[@]}"
        echo "已创建 Release $tag"
    - name: Publish Summary
      if: always()
      shell: bash
      run: |
        {
          echo "### 发布结果"
          echo ""
          echo "| 渠道 | 结果 |"
          echo "| --- | --- |"
          echo "| GitHub Packages | ${{ steps.ghpackages.outcome }} |"
          echo "| NuGet.org | ${{ steps.nuget.outcome }} |"
          echo "| GitHub Release | ${{ steps.release.outcome }} |"
          echo ""
          echo "> GitHub Release 仅 tag 推送时创建；手工触发只发包。"
        } >> "$GITHUB_STEP_SUMMARY"
