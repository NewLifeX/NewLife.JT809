name: readme

on:
  push:
    paths:
      - 'README*'
      - 'Readme*'
      - 'readme-languages.json'
      - 'readme-package.json'
      - 'readme-metrics.json'
      - 'tools/sync-readme-languages.ps1'
      - 'tools/sync-readme-package.ps1'
      - 'tools/sync-readme-metrics.ps1'
      - 'tools/verify-localization.ps1'
      - '.github/workflows/readme.yml'
      - 'NewLife.JT809/**'
  pull_request:
    paths:
      - 'README*'
      - 'Readme*'
      - 'readme-languages.json'
      - 'readme-package.json'
      - 'readme-metrics.json'
      - 'tools/sync-readme-languages.ps1'
      - 'tools/sync-readme-package.ps1'
      - 'tools/sync-readme-metrics.ps1'
      - 'tools/verify-localization.ps1'
      - '.github/workflows/readme.yml'
      - 'NewLife.JT809/**'
  workflow_dispatch:

jobs:
  languages:
    name: README languages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Check README languages
      shell: pwsh
      run: pwsh -File ./tools/sync-readme-languages.ps1 -Check
    - name: Verify localization tables
      shell: pwsh
      run: pwsh -File ./tools/verify-localization.ps1 -Check

  metrics:
    name: README metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Check README metrics
      shell: pwsh
      run: pwsh -File ./tools/sync-readme-metrics.ps1 -Check

  package:
    name: README package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Check README package
      shell: pwsh
      run: pwsh -File ./tools/sync-readme-package.ps1 -Check
